[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-atlas"
version = "0.1.0"
description = "AI-powered geopolitical documentary generation platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai",
    "python-dotenv",
    "requests",
    "beautifulsoup4",
    "lxml",
    "pydantic",
    "pydantic-settings",
    "rich",
    "aiohttp",
    "feedparser",
    "markdown",
    "tqdm",
    "newspaper4k",
    "tiktoken",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
atlas = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
